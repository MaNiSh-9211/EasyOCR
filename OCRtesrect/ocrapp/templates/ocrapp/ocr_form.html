<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR Image Upload</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; }
        .drop-area {
            border: 2px dashed #007bff;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            color: #888;
            margin-bottom: 20px;
            background: #f9f9f9;
            cursor: pointer;
        }
        .drop-area.dragover { background: #e3f2fd; border-color: #0056b3; }
        .file-input { display: none; }
        .btn { background: #007bff; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .btn:hover { background: #0056b3; }
        .result { margin-top: 30px; }
        .ocr-image { max-width: 100%; margin-top: 10px; border-radius: 6px; }
        textarea { width: 100%; min-height: 120px; margin-top: 10px; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 1em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>OCR Image Upload</h1>
        <form id="upload-form" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="drop-area" id="drop-area">
                <p>Drag & Drop an image here or click to select</p>
                <input type="file" name="image" id="fileElem" class="file-input" accept="image/*">
                <div id="file-confirm" style="color:green; margin-top:10px; display:none;">File selected and ready to upload.</div>
            </div>
            <button type="submit" class="btn">Upload & Extract Text</button>
        </form>
        <div id="processing" style="display:none; text-align:center; margin-top:20px; color:#007bff; font-weight:bold;">Processing... Please wait.</div>
        {% if extracted_text %}
        <div class="result">
            <h2>Extracted Text</h2>
            <textarea readonly>{{ extracted_text }}</textarea>
            {% if image_url %}
            <h3>Uploaded Image</h3>
            <img src="{{ image_url }}" alt="Uploaded Image" class="ocr-image">
            {% endif %}
        </div>
        {% endif %}
    </div>
    <script>
        const dropArea = document.getElementById('drop-area');
        const fileInput = document.getElementById('fileElem');
        const fileConfirm = document.getElementById('file-confirm');
        const uploadForm = document.getElementById('upload-form');
        const processingDiv = document.getElementById('processing');
        dropArea.addEventListener('click', () => fileInput.click());
        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.classList.add('dragover');
        });
        dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                fileConfirm.style.display = 'block';
            }
        });
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) {
                fileConfirm.style.display = 'block';
            } else {
                fileConfirm.style.display = 'none';
            }
        });
        uploadForm.addEventListener('submit', () => {
            processingDiv.style.display = 'block';
        });
    </script>
</body>
</html>
